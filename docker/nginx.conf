server {
    listen 80;
    server_name _;

    root /srv/roadmap/site;
    index index.html;
    charset utf-8;

    # The plan itself lives at the repo root, next to site/.
    location = /README.md {
        alias /srv/roadmap/README.md;
        default_type text/markdown;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
