# Serves the site from this repo and saves ticks to progress.json in it.
# Commit and push progress.json to keep your progress with the repo.
services:
  roadmap:
    build: .
    image: roadmap-site
    container_name: roadmap
    restart: always
    # Write progress.json as the repo owner, not root.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - .:/srv/roadmap
