<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Roadmap · DevOps to Senior SRE</title>
  <meta name="description" content="A gates-not-dates plan from DevOps engineer to Senior SRE / Platform Engineer, with progress tracking.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var t = localStorage.getItem('roadmap-theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#top">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Roadmap</span>
      <span class="brand-sub">DevOps → Senior SRE</span>
    </a>
    <div class="overall" title="Overall progress across every checklist item">
      <div class="bar"><span id="overall-fill"></span></div>
      <span id="overall-label" aria-live="polite">0%</span>
    </div>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Plan sections">
      <div class="sidebar-inner">
        <input type="search" id="filter" placeholder="Filter sections…" aria-label="Filter sections" autocomplete="off">
        <ol id="toc" class="toc"></ol>
        <div class="progress-tools">
          <p class="hint" id="progress-hint">Ticks are saved in this browser. Export them to move to another device.</p>
          <div class="tool-row">
            <button type="button" id="export-btn">Export</button>
            <label class="file-btn">Import<input type="file" id="import-input" accept="application/json,.json" hidden></label>
            <button type="button" id="reset-btn" class="danger">Reset</button>
          </div>
        </div>
      </div>
    </nav>
    <div class="scrim" id="scrim" hidden></div>

    <main id="content" class="content" tabindex="-1">
      <p class="loading">Loading the plan…</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
